[package]
name = "typescope"
version = "0.1.0"
edition = "2021"
description = "TypeScope 本地打字统计"
license = "MIT"

[dependencies]
typescope-proto = { path = "../typescope-proto" }
rusqlite = { version = "0.32", features = ["bundled"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "typescope-agent"
path = "src/bin/agent.rs"
