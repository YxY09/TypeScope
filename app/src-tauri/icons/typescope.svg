<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMono" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="wellMono" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Keycap Shell -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgMono)" stroke="#333333" stroke-width="6"/>

  <!-- Subtle Inner Keycap Dish -->
  <rect x="56" y="52" width="400" height="396" rx="76" fill="url(#wellMono)" stroke="#2A2A2A" stroke-width="3"/>

  <!-- 3 Ascending Scope Telemetry Bars (Left, Middle, Right) -->
  <!-- Left Bar (Low) -->
  <rect x="128" y="216" width="64" height="96" rx="14" fill="#8C8C8C"/>
  <!-- Middle Bar (Mid) -->
  <rect x="224" y="160" width="64" height="152" rx="14" fill="#C4C4C4"/>
  <!-- Right Bar (Peak) -->
  <rect x="320" y="104" width="64" height="208" rx="14" fill="#FFFFFF"/>

  <!-- Bottom Spacebar / Scope Baseline -->
  <rect x="128" y="344" width="256" height="56" rx="14" fill="#FFFFFF"/>
</svg>
